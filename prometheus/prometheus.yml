global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"  # Địa chỉ của Alertmanager

rule_files:
  - "rules/alert.rules.yml"  # Đảm bảo đường dẫn tới tệp cảnh báo là chính xác

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]  # Prometheus scrape chính nó

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]  # Địa chỉ của node_exporter
