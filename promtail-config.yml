server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: alert_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: alert_logger
          log_type: alert
          __path__: /var/log/alerts.log

  - job_name: request_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: alert_logger
          log_type: request
          __path__: /var/log/requests.log
